version: '3.8'

services:
  mca-automation:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mca-automation-app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SERVER_TOMCAT_THREADS_MAX=150
      - JAVA_OPTS=-Xms256m -Xmx512m
    restart: always
