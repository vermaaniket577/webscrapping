spring:
  application:
    name: mca-automation
  datasource:
    url: jdbc:h2:mem:mca_automation;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8081
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:100}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:10}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:100}

mca:
  crypto:
    passText: ${MCA_CRYPTO_PASS_TEXT:d6163f0659cfe4196dc03c2c29aab06f10cb0a79cdfc74a45da2d72358712e80}
    salt: ${MCA_CRYPTO_SALT:fc74a45dsalt}
    iv: ${MCA_CRYPTO_IV:c29aab06iv}
    keySize: ${MCA_CRYPTO_KEY_SIZE:128}
    iterations: ${MCA_CRYPTO_ITERATIONS:100}

ocr:
  #tessdataPath: ${OCR_TESSDATA_PATH:/usr/local/share/tessdata}
  tessdataPath: ${OCR_TESSDATA_PATH:C:\tesseract-5.4.0.20240606\tesseract-5.4.0.20240606\tessdata}

  language: ${OCR_LANGUAGE:eng}
  nativeLibraryPath: ${OCR_NATIVE_LIBRARY_PATH:}

browser-login:
  target-url: ${BROWSER_LOGIN_URL:https://example.com/login}
  dashboard-url-contains: ${BROWSER_DASHBOARD_PATTERN:dashboard}
  headless: ${BROWSER_HEADLESS:true}
  timeout-seconds: ${BROWSER_TIMEOUT:15}
  selectors:
    pan-input: ${SELECTOR_PAN:#pan}
    continue-button: ${SELECTOR_CONTINUE:#continue}
    password-input: ${SELECTOR_PASSWORD:#password}
    confirm-checkbox: ${SELECTOR_CONFIRM:#confirm}
    continue-button-2: ${SELECTOR_CONTINUE2:#continue}
    password-page-url-contains: ${PASSWORD_PAGE_PATTERN:password}

